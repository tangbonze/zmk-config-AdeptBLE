# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
# The board target is the Zephyr hardware model v2 name: the XIAO nRF52840
# ZMK variant is `xiao_ble//zmk` (the old `seeeduino_xiao_ble` no longer
# exists in Zephyr 4.1 / ZMK main).
---
include:
  # Normal firmware: ZMK Studio + DYA Studio over the USB CDC-ACM endpoint.
  - board: xiao_ble//zmk
    shield: AdeptBLE
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: AdeptBLE

  # Flash this once to wipe every stored setting (keymap edits, custom
  # settings, battery history, BLE pairings) and start over from the
  # firmware defaults. It erases settings on every boot, so do not keep it
  # flashed on the keyboard.
  - board: xiao_ble//zmk
    shield: AdeptBLE
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_SETTINGS_RESET_ON_START=y
    artifact-name: AdeptBLE_reset
