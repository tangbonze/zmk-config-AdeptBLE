CONFIG_ZMK_KEYBOARD_NAME="AdeptBLE"

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_GPIO=y

# CONFIG_ZMK_EXT_POWER=y

# ---------------------------------------------------------------------------
# PMW3610 trackball
#
# Uses cormoran's driver (devicetree compatible "cormoran,pmw3610") instead
# of badjeff's one: it is the driver DYA Studio's Trackball tab talks to, and
# it keeps the same devicetree options.
# ---------------------------------------------------------------------------
CONFIG_PINCTRL=y
CONFIG_PMW3610=y
# CONFIG_PMW3610_INVERT_X=y
# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1000
# Runtime axis/rotation changes are done from DYA Studio instead of here:
# CONFIG_PMW3610_SWAP_XY=y
# CONFIG_PMW3610_INVERT_Y=y

CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=200
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=300
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=500
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=3000
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=30000

CONFIG_PMW3610_REPORT_INTERVAL_MIN=12
CONFIG_PMW3610_SMART_ALGORITHM=y

# Sensor info / diagnostics / frame capture over the custom Studio RPC, and
# the sensor parameters (cpi, axis, downshift/sample times, ...) exposed as
# runtime custom settings ("cpi@trackball", ...).
CONFIG_ZMK_PMW3610_STUDIO_RPC=y
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

# ---------------------------------------------------------------------------
# ZMK Studio
#
# Locking is disabled: the lock state starts as UNLOCKED and nothing can lock
# it again (this ZMK fork exposes no lock/unlock RPC, and the idle-timeout /
# BLE-disconnect auto-lock paths are compiled out), so the keyboard is always
# editable and no &studio_unlock key binding is needed.
# ---------------------------------------------------------------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# ---------------------------------------------------------------------------
# DYA Studio (Custom Studio Protocol modules)
# ---------------------------------------------------------------------------

# Trackball tab - runtime input processors (pointer/scroll speed, rotation,
# axis snap, active layers, ...)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# Connection tab - BLE profiles, OS detection, per-endpoint default layer
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=5
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

# Settings tab - sleep/idle timeouts and typed custom settings
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y

# Keymap tab - trackball marker in the layout preview
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y

# Keymap tab - runtime macros, played with &rmacro <slot>
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# Identify behaviors by their CRC16 hash: stable local IDs across reboots
# without spending settings storage.
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y

# Keymap tab - runtime combos. Only the compile-time combo in the keymap
# exists until slots are created in DYA Studio.
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# Troubleshooting tab - device info and watchdog incident history
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y

# Settings/troubleshooting - battery level history (periodically flushed to
# flash; disable both if you do not want the extra flash writes)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y

# ---------------------------------------------------------------------------
# Power management
#
# Deep sleep. The keyboard only powers off on battery: ZMK skips the sleep
# transition while USB power is present, so a DYA Studio session over USB is
# never interrupted. Wake up by pressing any key (the kscan is a wakeup
# source).
#
# 30 minutes is just the firmware default; the timeout can be changed from
# DYA Studio's Settings tab (0 disables sleep) and is persisted in the
# keyboard's settings.
# ---------------------------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Several custom RPC subsystems are registered at once, which needs more
# stack and buffer room than ZMK's defaults.
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
